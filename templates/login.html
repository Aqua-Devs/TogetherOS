{% extends "base.html" %}

{% block title %}Login - TogetherOS{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 4rem auto;">
    <div class="card">
        <h2 class="text-center">💕 Welkom Terug</h2>
        <p class="text-secondary text-center mb-3">Log in om je relatie te versterken</p>
        
        <form method="POST">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            
            <div class="form-group">
                <label for="password">Wachtwoord</label>
                <input type="password" id="password" name="password" required>
            </div>
            
            <button type="submit" class="btn btn-primary btn-block">Inloggen</button>
        </form>
        
        <p class="text-center mt-3 text-secondary">
            Nog geen account? <a href="/register" style="color: var(--primary);">Registreer hier</a>
        </p>
    </div>
</div>
{% endblock %}
